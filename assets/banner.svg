<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Karthikeyan S - Electronics and Communication Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="0.6" stop-color="#140507"/>
      <stop offset="1" stop-color="#3a0a0f"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1a1a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff1a1a"/>
      <stop offset="1" stop-color="#ff1a1a" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typed">
      <rect x="185" y="170" height="40" width="0">
        <animate attributeName="width" values="0;630;630;0" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .mono{font-family:'Fira Code','Courier New',monospace}
      .pulse{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
      .scan{animation:scan 5s linear infinite}
      @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(280px)}}
    </style>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- faint circuit grid -->
  <g stroke="#ff1a1a" stroke-opacity="0.07">
    <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000M0 200H1000M0 240H1000"/>
    <path d="M100 0V260M200 0V260M300 0V260M400 0V260M500 0V260M600 0V260M700 0V260M800 0V260M900 0V260"/>
  </g>
  <rect class="scan" x="0" y="0" width="1000" height="3" fill="#ff1a1a" opacity="0.18"/>

  <!-- corner brackets -->
  <g stroke="#ff1a1a" stroke-width="3" fill="none">
    <path d="M25 70V25H70"/>
    <path d="M930 25H975V70"/>
    <path d="M25 190V235H70"/>
    <path d="M975 190V235H930"/>
  </g>

  <!-- pill -->
  <rect x="365" y="34" width="270" height="26" rx="13" fill="#1a0a0c" stroke="#ff1a1a" stroke-opacity="0.6"/>
  <circle class="pulse" cx="385" cy="47" r="4" fill="#ff1a1a"/>
  <text class="mono" x="500" y="52" text-anchor="middle" font-size="12" letter-spacing="2" fill="#ff6b6b">BUILDING REAL-WORLD TECH</text>

  <!-- name -->
  <text class="mono" x="500" y="122" text-anchor="middle" font-size="54" font-weight="700" fill="#ffffff" filter="url(#glow)" letter-spacing="3">KARTHIKEYAN S</text>

  <!-- role -->
  <text class="mono" x="500" y="152" text-anchor="middle" font-size="14" letter-spacing="3" fill="#cfcfcf">ELECTRONICS &amp; COMMUNICATION ENGINEER  •  EMBEDDED SYSTEMS  •  AI &amp; IoT</text>

  <rect x="250" y="162" width="500" height="2" fill="url(#line)"/>

  <!-- typed tagline -->
  <g clip-path="url(#typed)">
    <text class="mono" x="500" y="197" text-anchor="middle" font-size="20" fill="#ff3b3b">Designing Smart Solutions for Real-World Challenges</text>
  </g>
  <rect y="178" width="3" height="24" fill="#ff1a1a">
    <animate attributeName="x" values="185;815;815;185" keyTimes="0;0.5;0.85;1" dur="8s" repeatCount="indefinite"/>
  </rect>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
